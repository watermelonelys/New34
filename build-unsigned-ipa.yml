name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned, generic iOS device)
        run: |
          xcodebuild \
            -project HeliumPad.xcodeproj \
            -scheme HeliumPad \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/HeliumPad.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Could not find built .app at $APP_PATH"
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr HeliumPad-unsigned.ipa Payload
          ls -la HeliumPad-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliumPad-unsigned-ipa
          path: HeliumPad-unsigned.ipa
          if-no-files-found: error
